# Round 36 line I evo bench (dsh-evo-bench.yml), DEFAULT route, identical in ALL
# groups: the shipped `opencode-go` provider of DSH's pi-ai catalog with NOTHING
# overridden but the baseURL, which points at the record-only cache-bench proxy
# (port 18731, tag "main"; the proxy forwards to https://opencode.ai, i.e. the
# catalog's own https://opencode.ai/inference/go/v1). Window, maxTokens and the
# OpenCode session header therefore come from the catalog exactly as a user of
# this route gets them: deepseek-v4.1-flash contextWindow 1 000 000, maxTokens
# 384 000 (@earendil-works/pi-ai providers/data/opencode-go.json in DSH
# 0.2.1-rc.5). No historian route: Magic Context's historian uses its default
# (the main model). User instruction 2026-11-07 01:18–01:20 CST: real-use
# defaults; only the bench-validity measures stay (git history stripped, network
# block, test isolation, per-turn timeout).
# Measured (runs 42262147533 / 42262946905, plugin log thresholdPct=90): the
# catalog maxTokens is applied per request by the pi-ai adapter (clamped to
# window - prompt), NOT exposed as the request header's maxTokens /
# defaultMaxTokens, so compaction reserves 0 output tokens: DSH compaction-basic
# fires at min(0.8w, w - 0 - 65536) = 800 000, the plugin's native backstop at
# 90 % = 900 000; Magic Context's shipped execute threshold 65 % = 650 000.
# (The earlier "550 464" assumed a 384 000 reservation.)
# The previous 200k / maxTokens 32768 route is evo-model-200k-stress.yml.
- id: llm-pi-ai
  config:
    providers:
      opencode-go:
        apiKeyEnv: OPENCODE_API_KEY
        baseURL: http://127.0.0.1:18731/r/main/inference/go/v1
- id: agent-default-model
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash
