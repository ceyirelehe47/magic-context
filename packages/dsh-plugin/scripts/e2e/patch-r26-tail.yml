# Round 26 scenario T (ci-t.sh; limitation 17 / task P1-2): a REAL main model
# (OpenCode Go, 40k route) with the deterministic mock as the HISTORIAN route,
# so `/compact`'s mini-historian answers a real `<unprocessed_from>` inside the
# region (mock-llm.mjs MOCK_HISTORIAN_DEFER_NEEDLE: unprocessed from the user
# constraint). Native backstop 90 % / 4 000 retained tokens on the 40k route
# (as patch-r22-lock-c.yml), so only the e2e `/compact` at idle compacts.
# Self-contained (both providers), whatever the patch merge semantics.
- id: llm-pi-ai
  config:
    providers:
      opencode-go-40k:
        displayName: OpenCode Go (40k)
        apiKeyEnv: OPENCODE_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        headers:
          x-opencode-session: !!js process.env.OPENCODE_SESSION
        models:
          - id: deepseek-v4.1-flash
            contextWindow: 40000
            maxTokens: 4096
      mock-200k:
        displayName: Mock (200k, historian)
        apiKeyEnv: MOCK_LLM_KEY
        api: openai-completions
        baseURL: !!js "'http://127.0.0.1:' + (process.env.MOCK_LLM_PORT ?? '18577') + '/w200000/v1'"
        headers:
          x-opencode-session: !!js process.env.OPENCODE_SESSION
        models:
          - id: mock-model
            contextWindow: 200000
            maxTokens: 16384
- id: agent-default-model
  config:
    provider: opencode-go-40k
    model: deepseek-v4.1-flash
- id: magic-agent
  config:
    historian:
      model: mock-200k/mock-model
      executeThresholdPercentage: !!js Number(process.env.MC_HISTORIAN_THRESHOLD ?? 95)
- id: magic-compaction
  config:
    auto: true
    modelPolicies:
      - provider: opencode-go-40k
        model: deepseek-v4.1-flash
        headroomTokens: 0
        thresholdRatio: 0.9
        retainTokens: 4000
        maxTokens: 4096
