# --patch overlay: real model routes through OpenCode Go (pi-ai adapter).
#
#   opencode-go      deepseek-v4.1-flash with a deliberately SMALL 24k window
#                    (drives real context pressure -> historian trigger)
#   opencode-go-big  same model, 200k window: the historian route
#                    (the ~18k compartment prompt does not fit the 24k route:
#                    finish=max-tokens after 1 output token)
#   opencode-go-40k  same model, 40k window: round 17 scenario C (main session
#                    pushed past the UNCHANGED 65 % execute threshold in a
#                    handful of real turns) and the parent of scenario S
#   opencode-go-100k same model, 100k window: round 19 scenario P (native
#                    pressure compaction must stay behind MC's 65 %; the DSH
#                    default fires at min(0.8w, w-4096-65536) = 30.4 %)
#   opencode-go-child same model, 24k window, 2048 output: the delegated child
#                    of scenario S (patch-r17-child.yml routes `subagent` here
#                    and gives compaction-basic a small-window policy for it)
#
# MC_E2E_MAIN_PROVIDER selects the main agent route (default opencode-go).
#
# The key comes from OPENCODE_API_KEY (never written here); the session header
# comes from OPENCODE_SESSION (run-e2e.sh sets a random one).
- id: llm-pi-ai
  config:
    providers:
      opencode-go:
        displayName: OpenCode Go (24k)
        apiKeyEnv: OPENCODE_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        headers:
          x-opencode-session: !!js process.env.OPENCODE_SESSION
        models:
          - id: deepseek-v4.1-flash
            contextWindow: 24000
            maxTokens: 4096
      opencode-go-big:
        displayName: OpenCode Go (200k, historian)
        apiKeyEnv: OPENCODE_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        headers:
          x-opencode-session: !!js process.env.OPENCODE_SESSION
        models:
          - id: deepseek-v4.1-flash
            contextWindow: 200000
            maxTokens: 16384

      opencode-go-40k:
        displayName: OpenCode Go (40k)
        apiKeyEnv: OPENCODE_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        headers:
          x-opencode-session: !!js process.env.OPENCODE_SESSION
        models:
          - id: deepseek-v4.1-flash
            contextWindow: 40000
            maxTokens: 4096
      opencode-go-100k:
        displayName: OpenCode Go (100k)
        apiKeyEnv: OPENCODE_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        headers:
          x-opencode-session: !!js process.env.OPENCODE_SESSION
        models:
          - id: deepseek-v4.1-flash
            contextWindow: 100000
            maxTokens: 4096
      opencode-go-child:
        displayName: OpenCode Go (24k child)
        apiKeyEnv: OPENCODE_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        headers:
          x-opencode-session: !!js process.env.OPENCODE_SESSION
        models:
          - id: deepseek-v4.1-flash
            contextWindow: 24000
            maxTokens: 2048

- id: agent-default-model
  config:
    provider: !!js process.env.MC_E2E_MAIN_PROVIDER ?? "opencode-go"
    model: deepseek-v4.1-flash

- id: magic-agent
  config:
    historian:
      model: opencode-go-big/deepseek-v4.1-flash
      executeThresholdPercentage: !!js Number(process.env.MC_HISTORIAN_THRESHOLD ?? 40)
