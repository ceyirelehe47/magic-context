# dsh-magic-context — host bundle patch.
#
# Mounts the HOST-plane rows of the Magic adapter. The AGENT-plane rows
# (magic-compaction, magic-agent) and the magic-meter row are written by
# `dsh-magic-context setup` as a managed block in the profile's own
# `cordis.patch.yml` (flat root tree, or the selected web agent presets).
#
# Rows here (host plane, process-global):
#   - magic-host:  boots the shared SQLite + provides ctx.magicContextHost
#                  (bootstrap, canonical session keys, liveness marker)
#   - magic-remote: the `magicContext/*` Typert endpoints for the Web client
#                  (status, settings, updateSettings, context)
#
# Removing the package from the profile's bundles reverts everything (no
# persistent side effects beyond the shared Magic DB, which is harness-shared
# by design).
- insert:
    - id: magic-host
      name: 'dsh-magic-context'
      inject: []

    - id: magic-remote
      name: 'dsh-magic-context/remote'
      inject: [magicContextHost, typert]
