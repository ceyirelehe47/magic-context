# DSH fork CI: the DeepSeek Harness adapter lane (packages/adapter-api +
# packages/dsh-plugin) on GitHub-hosted runners, so the heavy checks do not
# have to run on a small local sandbox. See docs/DSH-MAINTENANCE.md ("CI").
#
#   checks  every push to dsh-integration / dsh-sync/** and every dispatch:
#           filtered install → typecheck:dsh → core typecheck → dsh-plugin
#           tests → adapter-api tests → contracts:dsh → ci-check.py unit tests
#           (R14 / Y2 / empty input, round 33; unique ids, round 34) → wf-lint
#   e2e     ONLY on workflow_dispatch with input e2e=true (spends model quota):
#           real @deepseek-ai/dsh 0.2.1-rc.5 (or input dsh_version, e.g. the
#           declared 0.2.2-alpha.3 / 0.2.2-rc.1) headless + OpenCode Go
#           (secret OPENCODE_API_KEY): worker self-test (normal + 1500 ms
#           timeout), one session over three processes (§N§ identity across
#           restarts), round 17 real-use scenarios (main session past the 65 %
#           threshold on a 40k route, compartments re-injected across
#           processes; delegated child reading eight <8 KB files until
#           compaction-basic summarizes on its 24k route;
#           ctx_search/ctx_memory/ctx_expand + status readouts); redacted logs
#           uploaded as an artifact (7 days)
#
# Upstream workflows are left untouched (ci.yml is disabled in the fork's
# Actions settings). This file is new and lives only on the DSH branches.
name: dsh-ci

on:
  push:
    branches: [dsh-integration, "dsh-sync/**"]
  workflow_dispatch:
    inputs:
      e2e:
        description: "Also run the real-model DSH e2e job (uses OPENCODE_API_KEY quota)"
        type: boolean
        default: false
      slot:
        description: "Optional concurrency slot: dispatches with different slots run in parallel instead of queueing (round 28, repeated e2e for I1 statistics)"
        type: string
        default: ""
      dsh_version:
        description: "Optional @deepseek-ai/dsh version for the e2e job. Declared releases (rounds 29/30): 0.2.1-rc.5 (default, node 22), 0.2.2-alpha.3 and 0.2.2-rc.1 (node 24) run with no exemption; any other version is the evaluation lane (exact-version exemption). Empty = DSH_PINNED below. Only the e2e job uses it; checks always run on the repo lockfile's DSH."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: dsh-ci-${{ github.ref }}-${{ github.event_name }}${{ inputs.slot && format('-{0}', inputs.slot) || '' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  BUN_VERSION: 1.4.2 # packageManager: bun@1.4.2
  DSH_PINNED: 0.2.1-rc.5 # default DSH (src/doctor/env.ts DSH_COMPAT_EXPECTED_VERSION); declared: DSH_COMPAT_SUPPORTED_VERSIONS
  DSH_VERSION: ${{ inputs.dsh_version || '0.2.1-rc.5' }}

jobs:
  checks:
    if: github.repository == 'ceyirelehe47/magic-context'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install the DSH lane (filtered, no lifecycle scripts)
        run: |
          bun install --ignore-scripts \
            --filter '@cortexkit/opencode-magic-context' \
            --filter '@cortexkit/retina-local-fs' \
            --filter 'dsh-magic-context-adapter' \
            --filter 'dsh-magic-context'

      - name: typecheck:dsh (adapter-api + dsh-plugin, incl. compile-time DSH API contract)
        id: tc_dsh
        continue-on-error: true
        run: bun run typecheck:dsh

      - name: dsh-plugin test-file typecheck (*.test.ts; gating since round 21)
        id: tc_tests
        continue-on-error: true
        run: |
          bun run --cwd packages/dsh-plugin tsc --noEmit -p tsconfig.test.json 2>&1 | tee "$RUNNER_TEMP/tc-tests.log"; rc=${PIPESTATUS[0]}
          echo "test-file type errors: $(grep -c 'error TS' "$RUNNER_TEMP/tc-tests.log")"
          exit $rc

      - name: core typecheck (packages/plugin)
        id: tc_core
        continue-on-error: true
        run: bun run --cwd packages/plugin typecheck

      - name: dsh-plugin tests
        id: t_dsh
        continue-on-error: true
        run: bun run --cwd packages/dsh-plugin test 2>&1 | tee "$RUNNER_TEMP/dsh-plugin.log"; exit ${PIPESTATUS[0]}

      - name: adapter-api tests
        id: t_api
        continue-on-error: true
        run: bun run --cwd packages/adapter-api test 2>&1 | tee "$RUNNER_TEMP/adapter-api.log"; exit ${PIPESTATUS[0]}

      - name: contracts:dsh
        id: t_contracts
        continue-on-error: true
        run: bun run contracts:dsh 2>&1 | tee "$RUNNER_TEMP/contracts.log"; exit ${PIPESTATUS[0]}

      - name: ci-check.py unit tests (R14, Y2, empty input; round 33 — unique ids; round 34; evo analyze subagent kinds, round 36 line I; gating)
        id: t_cicheck
        continue-on-error: true
        run: |
          set -o pipefail
          rc=0
          for t in test_ci_check_r14.py test_ci_check_y2.py test_ci_check_empty.py test_ci_check_ids.py test_evo_analyze.py test_evo_turn_policy.py test_evo_probe_storage.py test_evo_isolation_env.py; do
            echo "== $t"
            python3 "packages/dsh-plugin/scripts/e2e/$t" -v 2>&1 | tee -a "$RUNNER_TEMP/ci-check-tests.log" || rc=1
          done
          exit $rc

      - name: workflow false-positive lint (dsh-*.yml; round 33)
        id: wf_lint
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --user pyyaml
          python3 packages/dsh-plugin/scripts/ci/wf-lint.py selftest
          python3 packages/dsh-plugin/scripts/ci/wf-lint.py lint | tee "$RUNNER_TEMP/wf-lint.log"

      - name: Summary
        if: always()
        run: |
          set -o pipefail
          # Round 33 (P1-B): the summary names what actually ran — the DSH the lockfile
          # installed (dsh-session's package.json), the runtimes and the commit.
          dshv="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$(readlink -f node_modules/@deepseek-ai/dsh-session/package.json 2>/dev/null || readlink -f packages/dsh-plugin/node_modules/@deepseek-ai/dsh-session/package.json)" 2>/dev/null || echo unknown)"
          count() { grep -E "^ *[0-9]+ $2\$" "$RUNNER_TEMP/$1.log" 2>/dev/null | awk '{print $1}' | tail -n 1; }
          {
            echo "### dsh-ci checks @ ${GITHUB_SHA::9}"
            echo "DSH version (installed): $dshv (lockfile; dsh-session package.json) · node -v $(node -v 2>/dev/null || echo none) (tests run on bun $(bun --version)) · GITHUB_SHA $GITHUB_SHA"
            echo "| step | outcome | pass | fail |"
            echo "|---|---|---|---|"
            echo "| typecheck:dsh | ${{ steps.tc_dsh.outcome }} | | |"
            echo "| test-file typecheck | ${{ steps.tc_tests.outcome }} | | $(grep -c 'error TS' "$RUNNER_TEMP/tc-tests.log" 2>/dev/null) |"
            echo "| core typecheck | ${{ steps.tc_core.outcome }} | | |"
            echo "| dsh-plugin | ${{ steps.t_dsh.outcome }} | $(count dsh-plugin pass) | $(count dsh-plugin fail) |"
            echo "| adapter-api | ${{ steps.t_api.outcome }} | $(count adapter-api pass) | $(count adapter-api fail) |"
            echo "| contracts:dsh | ${{ steps.t_contracts.outcome }} | $(count contracts pass) | $(count contracts fail) |"
            echo "| ci-check.py unit tests | ${{ steps.t_cicheck.outcome }} | $(grep -cE '\.\.\. ok$' "$RUNNER_TEMP/ci-check-tests.log" 2>/dev/null) | $(grep -cE '\.\.\. (FAIL|ERROR)$' "$RUNNER_TEMP/ci-check-tests.log" 2>/dev/null) |"
            echo "| wf-lint (dsh-*.yml) | ${{ steps.wf_lint.outcome }} | | $(grep -c '| FAIL |' "$RUNNER_TEMP/wf-lint.log" 2>/dev/null) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for o in "${{ steps.tc_dsh.outcome }}" "${{ steps.tc_tests.outcome }}" "${{ steps.tc_core.outcome }}" "${{ steps.t_dsh.outcome }}" \
                   "${{ steps.t_api.outcome }}" "${{ steps.t_contracts.outcome }}" "${{ steps.t_cicheck.outcome }}" "${{ steps.wf_lint.outcome }}"; do
            [ "$o" = "success" ] || exit 1
          done

  # Round 31: the compile-time DSH API contract (typecheck:dsh) and the runtime
  # contracts (contracts:dsh) against every declared DSH other than the
  # lockfile's 0.2.1-rc.5 — the @deepseek-ai packages are swapped in a throwaway
  # checkout by overlay-dsh-types.sh (lockfile / package.json untouched).
  contracts-dsh:
    if: github.repository == 'ceyirelehe47/magic-context'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dsh: ["0.2.2-alpha.3", "0.2.2-rc.1"]
    name: contracts (DSH ${{ matrix.dsh }})
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the DSH lane (filtered, no lifecycle scripts)
        run: |
          bun install --ignore-scripts \
            --filter '@cortexkit/opencode-magic-context' \
            --filter '@cortexkit/retina-local-fs' \
            --filter 'dsh-magic-context-adapter' \
            --filter 'dsh-magic-context'
      - name: Overlay DSH ${{ matrix.dsh }} (@deepseek-ai/*)
        # Round 33 (P1-B): without pipefail (default run shell is `bash -e`) tee hid a
        # failing overlay and the next steps checked the lockfile's rc.5 instead.
        run: |
          set -o pipefail
          bash packages/dsh-plugin/scripts/e2e/overlay-dsh-types.sh "${{ matrix.dsh }}" "$RUNNER_TEMP/dsh-overlay" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: typecheck:dsh against DSH ${{ matrix.dsh }}
        id: tc
        run: bun run typecheck:dsh
      - name: contracts:dsh against DSH ${{ matrix.dsh }}
        id: ct
        run: |
          set -o pipefail
          bun run contracts:dsh 2>&1 | tee "$RUNNER_TEMP/contracts.log"
      - name: Summary
        if: always()
        run: |
          set -o pipefail
          v="$(readlink -f packages/dsh-plugin/node_modules/@deepseek-ai/dsh-session/package.json 2>/dev/null || readlink -f node_modules/@deepseek-ai/dsh-session/package.json)"
          {
            echo "DSH version (installed): $(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$v" 2>/dev/null || echo unknown) (expected ${{ matrix.dsh }}) · node -v $(node -v) · GITHUB_SHA $GITHUB_SHA"
            echo "typecheck:dsh ${{ steps.tc.outcome }} · contracts:dsh ${{ steps.ct.outcome }} $(grep -E '^ *[0-9]+ (pass|fail)$' "$RUNNER_TEMP/contracts.log" 2>/dev/null | tr '\n' ' ')"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  e2e:
    if: >-
      github.repository == 'ceyirelehe47/magic-context' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: Scratch dirs (outside the checkout)
        run: |
          echo "E2E_ROOT=$RUNNER_TEMP/e2e" >> "$GITHUB_ENV"
          echo "CI_OUT=$RUNNER_TEMP/e2e/ci" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          # Round 30: DSH 0.2.2-* (alpha.3, rc.1) declare engines node >= 24.9.0; the default
          # 0.2.1-rc.5 path stays on node 22 (unchanged). setup-node '24' = newest 24.x.
          node-version: ${{ env.DSH_VERSION == '0.2.1-rc.5' && '22' || '24' }}

      - name: Bootstrap (filtered workspace install + local DSH ${{ env.DSH_VERSION }})
        # Same script as the local r9–r13 runs; BUN_VERSION makes it keep the
        # runner's bun instead of downloading one.
        working-directory: packages/dsh-plugin
        env:
          INSTALL_TIMEOUT: "600"
        run: |
          bash scripts/e2e/bootstrap.sh
          # Round 33 (P1-B): fail here, not later, when the installed DSH is not the requested one.
          got="$(node -p "require('$E2E_ROOT/dsh/node_modules/@deepseek-ai/dsh/package.json').version")"
          [ "$got" = "$DSH_VERSION" ] || { echo "::error::installed DSH $got, requested $DSH_VERSION"; exit 1; }
          node "$E2E_ROOT/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js" --version || true

      - name: Build + install into a scratch profile + setup/doctor
        working-directory: packages/dsh-plugin
        run: |
          bun run build
          bash scripts/e2e/install-profile.sh test headless
          source scripts/e2e/env.sh
          # Round 29: the plugin declares the exact DSH releases in its peers
          # (0.2.1-rc.5 || 0.2.2-alpha.3 || 0.2.2-rc.1; src/doctor/env.ts
          # DSH_COMPAT_SUPPORTED_VERSIONS). On a declared DSH the bundle boots
          # with no exemption and doctor must exit 0, exactly as on rc.5.
          # Round 28b evaluation lane, kept ONLY for a DSH the package does not
          # declare (dsh_version input, e.g. 0.2.2-rc.1): DSH skips such a
          # bundle at boot unless the profile holds its exact-version
          # exemption, so grant it (explicit risk acceptance) and tolerate
          # doctor's version line as the single FAIL.
          if python3 scripts/e2e/dsh-declared.py package.json "$DSH_VERSION"; then
            echo "DSH_DECLARED=1" >> "$GITHUB_ENV"
          else
            echo "DSH_DECLARED=0" >> "$GITHUB_ENV"
            ver=$(node -p "require('./package.json').version")
            node "$DSH_BIN" plugin --profile test allow-version "dsh-magic-context@$ver" --dsh-version "$DSH_VERSION" --accept-risk
            echo "::warning::DSH $DSH_VERSION is not declared by dsh-magic-context@$ver: exact-version exemption granted (evaluation lane)"
          fi
          node dist/cli.js setup --profile test
          set +e
          node dist/cli.js doctor --profile test | tee "$RUNNER_TEMP/doctor.txt"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            other=$(grep '^\[FAIL\]' "$RUNNER_TEMP/doctor.txt" | grep -vc '^\[FAIL\] DSH version$' || true)
            if ! python3 scripts/e2e/dsh-declared.py package.json "$DSH_VERSION" >/dev/null && [ "$other" = "0" ]; then
              echo "::warning::doctor: only the DSH version line failed (installed $DSH_VERSION is not declared)"
            else
              exit "$rc"
            fi
          fi

      - name: Real turns (worker self-test, 3-process session, round 17 scenarios C/S/U)
        working-directory: packages/dsh-plugin
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then echo "::error::secret OPENCODE_API_KEY is not set"; exit 1; fi
          bash scripts/e2e/ci-e2e.sh

      - name: Redact logs
        if: always()
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          mkdir -p "$CI_OUT"
          python3 packages/dsh-plugin/scripts/e2e/ci-check.py redact "$CI_OUT"

      - name: Check
        id: check
        working-directory: packages/dsh-plugin
        run: |
          set +e
          python3 scripts/e2e/ci-check.py check "$CI_OUT"
          rc=$?
          echo "DSH $DSH_VERSION (default $DSH_PINNED; declared by the package: ${DSH_DECLARED:-?})" >> "$GITHUB_STEP_SUMMARY"
          # Round 33 (P1-B): what actually ran, read from the installed package.json.
          echo "DSH version (installed): $(node -p "require('$E2E_ROOT/dsh/node_modules/@deepseek-ai/dsh/package.json').version" 2>/dev/null || echo unknown) · plugin $(node -p "require('./package.json').version") · GITHUB_SHA $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "node $(node --version)" >> "$GITHUB_STEP_SUMMARY"
          cat "$CI_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Upload redacted e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/e2e/ci
          retention-days: 7
          if-no-files-found: warn
