# Round 26 (P2-5) — release acceptance of the PACKED tarballs.
#   pack:   build + `bun pm pack` the plugin at HEAD and at tag dsh/0.49.35-dsh.2
#           (each from its own checkout, its own lockfile) → artifact tgz-<ref>
#   accept: clean runner, NO repo workspace install: DSH from npm, the plugin
#           only from the two tarballs via `dsh plugin --profile headless add`.
#           install dsh.2 → upgrade HEAD (data kept) → disable → roll back dsh.2
#           (data readable or an explicit schema refusal). Judged by
#           install-accept-check.py. Mock model only: no secrets.
# Round 33 (P0, dsh.7 candidate): the HEAD tarball is the dispatched ref's own
# HEAD (never a tag); input old_ref picks the release it upgrades from / rolls
# back to (default dsh.2; dsh/0.49.35-dsh.6 for the dsh.7 candidate). pack also
# runs `npm pack` and judges the tarball against its source manifest
# (scripts/ci/tarball-inspect.py); accept adds the npm path next to the
# npm-installed DSH (npm-bin-accept.sh: B2 ERESOLVE, B4 bin symlink) and the
# ctx_expand probe in install-accept.sh (B5), each with the OLD tarball as control.
name: dsh-install

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "Optional @deepseek-ai/dsh version for the accept job. Declared (rounds 29/30): 0.2.1-rc.5 (default, node 22), 0.2.2-alpha.3, 0.2.2-rc.1 (node 24) — HEAD gets no exemption there; an exemption is granted only to a tarball that does not declare the DSH (e.g. the old dsh.2 off rc.5). Empty = DSH_PINNED."
        type: string
        default: ""
      old_ref:
        description: "Released tag the HEAD tarball upgrades from and rolls back to (round 33). Default dsh/0.49.35-dsh.2."
        type: string
        default: "dsh/0.49.35-dsh.2"

permissions:
  contents: read
  actions: read

env:
  BUN_VERSION: 1.4.2
  DSH_PINNED: 0.2.1-rc.5 # default DSH (src/doctor/env.ts DSH_COMPAT_EXPECTED_VERSION); declared: DSH_COMPAT_SUPPORTED_VERSIONS
  DSH_VERSION: ${{ inputs.dsh_version || '0.2.1-rc.5' }}

jobs:
  pack:
    if: github.repository == 'ceyirelehe47/magic-context'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: head
            ref: ""
          - name: old
            ref: ${{ inputs.old_ref || 'dsh/0.49.35-dsh.2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - name: Inspection tools from the dispatched ref (an old tag does not have them)
        uses: actions/checkout@v4
        with:
          path: _tools
          sparse-checkout: packages/dsh-plugin/scripts/ci
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Filtered workspace install + build + pack
        run: |
          set -o pipefail
          timeout 600 bun install --ignore-scripts --backend=hardlink \
            --filter '@cortexkit/opencode-magic-context' --filter '@cortexkit/retina-local-fs' \
            --filter 'dsh-magic-context-adapter' --filter 'dsh-magic-context'
          cd packages/dsh-plugin
          bun run build
          rm -f dsh-magic-context-*.tgz
          timeout 120 bun pm pack --quiet
          mkdir -p "$RUNNER_TEMP/tgz"
          mv dsh-magic-context-*.tgz "$RUNNER_TEMP/tgz/${{ matrix.name }}.tgz"
          tar -tzf "$RUNNER_TEMP/tgz/${{ matrix.name }}.tgz" | wc -l
          tar -xzOf "$RUNNER_TEMP/tgz/${{ matrix.name }}.tgz" package/package.json | python3 -c 'import json,sys; p=json.load(sys.stdin); print(p["name"], p["version"], p.get("dependencies"))'
          git rev-parse HEAD > "$RUNNER_TEMP/tgz/${{ matrix.name }}.sha"
          echo "${{ matrix.name }}: ref '${{ matrix.ref || github.ref_name }}' = $(git rev-parse HEAD), tarball $(tar -xzOf "$RUNNER_TEMP/tgz/${{ matrix.name }}.tgz" package/package.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: npm pack + inspect the tarball (HEAD gates, OLD informational)
        run: |
          set -o pipefail
          cd packages/dsh-plugin
          mkdir -p "$RUNNER_TEMP/npmpack"
          timeout 120 npm pack --pack-destination "$RUNNER_TEMP/npmpack" > "$RUNNER_TEMP/npmpack/npm-pack.log" 2>&1 || { cat "$RUNNER_TEMP/npmpack/npm-pack.log"; exit 1; }
          N="$(ls "$RUNNER_TEMP"/npmpack/dsh-magic-context-*.tgz)"
          rc=0
          python3 "$GITHUB_WORKSPACE/_tools/packages/dsh-plugin/scripts/ci/tarball-inspect.py" "$RUNNER_TEMP/tgz/${{ matrix.name }}.tgz" package.json --npm "$N" > "$RUNNER_TEMP/tgz/${{ matrix.name }}-inspect.md" || rc=$?
          { echo "node -v $(node -v) · bun $(bun --version) · npm $(npm --version) · GITHUB_SHA $GITHUB_SHA"; cat "$RUNNER_TEMP/tgz/${{ matrix.name }}-inspect.md"; } | tee -a "$GITHUB_STEP_SUMMARY"
          cp "$N" "$RUNNER_TEMP/tgz/${{ matrix.name }}-npm.tgz"
          if [ "${{ matrix.name }}" = head ]; then exit $rc; fi
          [ "$rc" = 0 ] || echo "::warning::OLD tarball differs from its manifest (informational)"
      - uses: actions/upload-artifact@v4
        with:
          name: tgz-${{ matrix.name }}
          path: ${{ runner.temp }}/tgz
          retention-days: 7

  accept:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packages/dsh-plugin/scripts/e2e
      - uses: actions/setup-node@v4
        with:
          # Round 30: DSH 0.2.2-* (alpha.3, rc.1) declare engines node >= 24.9.0; the default
          # 0.2.1-rc.5 path stays on node 22 (unchanged). setup-node '24' = newest 24.x.
          node-version: ${{ env.DSH_VERSION == '0.2.1-rc.5' && '22' || '24' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: tgz-*
          path: ${{ runner.temp }}/tgz
          merge-multiple: true
      - name: Clean env — DSH from npm only (no repo node_modules)
        run: |
          set -o pipefail
          echo "E2E_ROOT=$RUNNER_TEMP/e2e" >> "$GITHUB_ENV"
          echo "CI_OUT=$RUNNER_TEMP/e2e/accept" >> "$GITHUB_ENV"
          test ! -d node_modules && echo "repo node_modules: absent"
          mkdir -p "$RUNNER_TEMP/e2e/dsh"
          cd "$RUNNER_TEMP/e2e/dsh"
          echo '{"name":"dsh-accept","private":true}' > package.json
          timeout 300 npm install --no-audit --no-fund "@deepseek-ai/dsh@$DSH_VERSION"
          npm i -g pnpm@latest >/dev/null 2>&1
          echo "pnpm $(pnpm --version)"
          # Round 33 (P1-B): what actually ran — installed DSH from its package.json (must be
          # the requested one), node, the commit, the two tarballs.
          got="$(node -p "require('./node_modules/@deepseek-ai/dsh/package.json').version")"
          {
            echo "DSH version (installed): $got (requested $DSH_VERSION) · node -v $(node -v) · npm $(npm --version) · pnpm $(pnpm --version) · GITHUB_SHA $GITHUB_SHA"
            for t in head old; do echo "tarball $t: $(tar -xzOf "$RUNNER_TEMP/tgz/$t.tgz" package/package.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])') @ $(cat "$RUNNER_TEMP/tgz/$t.sha")"; done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$got" = "$DSH_VERSION" ] || { echo "::error::installed DSH $got, requested $DSH_VERSION"; exit 1; }
          node node_modules/@deepseek-ai/dsh/lib/bin.js --version || true
          ls -la "$RUNNER_TEMP/tgz"
      - name: install → upgrade → disable → roll back
        env:
          OPENCODE_API_KEY: unused-mock-only
        run: |
          bash packages/dsh-plugin/scripts/e2e/install-accept.sh "$RUNNER_TEMP/tgz/old.tgz" "$RUNNER_TEMP/tgz/head.tgz"
      - name: npm path next to the npm-installed DSH (B2 / B4; OLD = control)
        run: |
          # Round 33 experiment (NOT shipped, informational row X5): the HEAD tarball with
          # its OPTIONAL peers (client-* / react) removed, to see whether they are what
          # npm trips over next to rc.5 / alpha.3 (42050286656 / 42050293048: ERESOLVE via
          # the absent optional peer dsh-client-ui-primitives resolved to 0.2.2-rc.1).
          python3 - "$RUNNER_TEMP/tgz/head.tgz" "$RUNNER_TEMP/tgz/head-noopt.tgz" <<'PY'
          import io, json, sys, tarfile
          src, dst = sys.argv[1], sys.argv[2]
          with tarfile.open(src) as t, tarfile.open(dst, "w:gz") as o:
              for m in t.getmembers():
                  data = t.extractfile(m).read() if m.isfile() else None
                  if m.name == "package/package.json":
                      p = json.loads(data)
                      opt = [k for k, v in (p.get("peerDependenciesMeta") or {}).items() if v.get("optional")]
                      for k in opt:
                          p["peerDependencies"].pop(k, None)
                      p.pop("peerDependenciesMeta", None)
                      data = (json.dumps(p, indent=2) + "\n").encode()
                      m.size = len(data)
                      print("X5 variant: removed optional peers", opt)
                  o.addfile(m, io.BytesIO(data) if data is not None else None)
          PY
          bash packages/dsh-plugin/scripts/e2e/npm-bin-accept.sh "$RUNNER_TEMP/e2e/dsh" head="$RUNNER_TEMP/tgz/head.tgz" old="$RUNNER_TEMP/tgz/old.tgz" \
            head-alone="$RUNNER_TEMP/tgz/head.tgz" old-alone="$RUNNER_TEMP/tgz/old.tgz" \
            x5-noopt="$RUNNER_TEMP/tgz/head-noopt.tgz"
      - name: Check
        run: |
          set -o pipefail
          python3 packages/dsh-plugin/scripts/e2e/install-accept-check.py "$CI_OUT" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-install-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/e2e/accept
            ${{ runner.temp }}/tgz/*-inspect.md
          retention-days: 7
          if-no-files-found: warn
