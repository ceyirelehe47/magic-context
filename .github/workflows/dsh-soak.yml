# DSH fork: long low-cost soak of the DSH adapter (round 26, task pack P1-4).
# See docs/DSH-MAINTENANCE.md ("Soak") and packages/dsh-plugin/scripts/e2e/soak.sh.
#
# workflow_dispatch only. SEGMENTS serial jobs (matrix, max-parallel 1) of
# SEGMENT_MINUTES each; every segment restores the previous one's state (the
# shared Magic DB, the DSH sessions, the CSV and counters) from the artifact
# soak-state-<n-1>, loops real `dsh` headless processes on the deterministic
# mock model (24k window enforced, mock historian) with a REAL-model sample
# every REAL_EVERY_MINUTES (OpenCode Go, secret OPENCODE_API_KEY), and uploads
# soak-state-<n>. The final job runs soak-check.py over the whole CSV (RSS,
# DB / WAL, residue: leases / in-progress / outbox / open lock, leftover
# processes, latency, historian failures) and fails on a threshold.
#
#   short check:  segments=2  segment_minutes=10
#   12 h soak:    segments=4  segment_minutes=180
#
# Round 34 (user decision 2026-11-06 00:09 CST: unfrozen; RUNNING it still needs the
# user's approval): inputs dsh_version (default 0.2.1-rc.5) and node_version (default
# 22) — defaults reproduce the earlier behaviour exactly. dsh_version must be a DSH the
# package declares (dsh-declared.py; no exemption lane here); DSH 0.2.2-alpha.3 /
# 0.2.2-rc.1 need node >= 24.9 (checked on the input and on the installed node). Each
# segment fails when the installed DSH is not the requested one, and its summary names
# the installed DSH, node -v and GITHUB_SHA (round 33 CI audit finding 14); run steps
# use pipefail.
name: dsh-soak

on:
  workflow_dispatch:
    inputs:
      segments:
        description: "Serial segments (jobs)"
        default: "2"
      segment_minutes:
        description: "Minutes of runs per segment (job timeout = this + 40)"
        default: "10"
      real_every_minutes:
        description: "Real-model sample interval in minutes (0 = none)"
        default: "30"
      dsh_version:
        description: "@deepseek-ai/dsh version (round 34). Must be declared by the package: 0.2.1-rc.5 (default, node 22), 0.2.2-alpha.3, 0.2.2-rc.1 (node >= 24.9)"
        type: string
        default: "0.2.1-rc.5"
      node_version:
        description: "actions/setup-node version (round 34). Default 22; 0.2.2-alpha.3 / 0.2.2-rc.1 require >= 24.9 (e.g. 24 = newest 24.x)"
        type: string
        default: "22"

permissions:
  contents: read
  actions: read

concurrency:
  group: dsh-soak
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.2
  DSH_VERSION: ${{ inputs.dsh_version || '0.2.1-rc.5' }}
  NODE_VERSION: ${{ inputs.node_version || '22' }}

jobs:
  plan:
    if: github.repository == 'ceyirelehe47/magic-context'
    runs-on: ubuntu-latest
    outputs:
      segs: ${{ steps.p.outputs.segs }}
      timeout: ${{ steps.p.outputs.timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            packages/dsh-plugin/package.json
            packages/dsh-plugin/scripts/e2e/dsh-declared.py
          sparse-checkout-cone-mode: false
      - id: p
        run: |
          set -o pipefail
          n='${{ inputs.segments }}'; m='${{ inputs.segment_minutes }}'
          # Round 34: only a DSH the package declares (no support widening, no exemption lane),
          # and node >= 24.9 for the 0.2.2 line (DSH engines).
          python3 packages/dsh-plugin/scripts/e2e/dsh-declared.py packages/dsh-plugin/package.json "$DSH_VERSION" \
            || { echo "::error::dsh_version $DSH_VERSION is not declared by packages/dsh-plugin/package.json"; exit 1; }
          [[ "$NODE_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "::error::node_version must be N, N.M or N.M.P (got $NODE_VERSION)"; exit 1; }
          case "$DSH_VERSION" in
            0.2.2-alpha.3|0.2.2-rc.1)
              IFS=. read -r nmaj nmin _ <<< "$NODE_VERSION"
              if (( nmaj < 24 )) || { (( nmaj == 24 )) && [[ -n "$nmin" ]] && (( nmin < 9 )); }; then
                echo "::error::DSH $DSH_VERSION needs node >= 24.9 (node_version $NODE_VERSION)"; exit 1
              fi ;;
          esac
          [[ "$n" =~ ^[0-9]+$ && "$n" -ge 1 && "$n" -le 8 ]] || { echo "::error::segments must be 1..8"; exit 1; }
          [[ "$m" =~ ^[0-9]+$ && "$m" -ge 1 && "$m" -le 300 ]] || { echo "::error::segment_minutes must be 1..300"; exit 1; }
          echo "segs=$(python3 -c "import json;print(json.dumps(list(range(1,$n+1))))")" >> "$GITHUB_OUTPUT"
          echo "timeout=$((m + 40))" >> "$GITHUB_OUTPUT"

  soak:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        seg: ${{ fromJSON(needs.plan.outputs.segs) }}
    steps:
      - uses: actions/checkout@v4

      - name: Scratch dirs
        run: |
          echo "E2E_ROOT=$RUNNER_TEMP/e2e" >> "$GITHUB_ENV"
          echo "SOAK_STATE=$RUNNER_TEMP/soak-state" >> "$GITHUB_ENV"
          echo "PREV=$(( ${{ matrix.seg }} - 1 ))" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Bootstrap + build + scratch profile
        working-directory: packages/dsh-plugin
        env:
          INSTALL_TIMEOUT: "600"
        run: |
          set -o pipefail
          bash scripts/e2e/bootstrap.sh
          # Round 34: fail here when the installed DSH / node is not what was asked for, and
          # name what actually runs (CI audit finding 14).
          got="$(node -p "require('$E2E_ROOT/dsh/node_modules/@deepseek-ai/dsh/package.json').version")"
          [ "$got" = "$DSH_VERSION" ] || { echo "::error::installed DSH $got, requested $DSH_VERSION"; exit 1; }
          case "$DSH_VERSION" in
            0.2.2-alpha.3|0.2.2-rc.1)
              node -e 'const [a,b]=process.versions.node.split(".").map(Number); process.exit(a>24||(a===24&&b>=9)?0:1)' \
                || { echo "::error::DSH $DSH_VERSION needs node >= 24.9, runner has $(node -v)"; exit 1; } ;;
          esac
          echo "### soak segment ${{ matrix.seg }}: DSH version (installed): $got (requested $DSH_VERSION) · node -v $(node -v) · GITHUB_SHA $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          bun run build
          bash scripts/e2e/install-profile.sh test headless
          source scripts/e2e/env.sh
          node dist/cli.js setup --profile test

      - name: Previous segment state
        if: matrix.seg > 1
        uses: actions/download-artifact@v4
        with:
          name: soak-state-${{ env.PREV }}
          path: ${{ runner.temp }}/soak-state

      - name: Soak segment ${{ matrix.seg }}
        working-directory: packages/dsh-plugin
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          SOAK_SEGMENT: ${{ matrix.seg }}
          SOAK_MINUTES: ${{ inputs.segment_minutes }}
          SOAK_REAL_EVERY_MIN: ${{ inputs.real_every_minutes }}
        run: |
          set -o pipefail
          if [ "${{ matrix.seg }}" -gt 1 ] && [ ! -f "$SOAK_STATE/state.tgz" ]; then
            echo "::error::segment ${{ matrix.seg }}: no state from segment $PREV"; exit 1
          fi
          bash scripts/e2e/soak.sh
          python3 scripts/e2e/soak-check.py "$SOAK_STATE/soak.csv" "$SOAK_STATE/summary-${{ matrix.seg }}.md" || true
          cat "$SOAK_STATE/summary-${{ matrix.seg }}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Redact text files
        if: always()
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          python3 - "$SOAK_STATE" <<'PY'
          import os, sys, pathlib
          key = os.environ.get("OPENCODE_API_KEY", "")
          for p in pathlib.Path(sys.argv[1]).glob("*"):
              if p.suffix not in (".log", ".csv", ".jsonl", ".md", ".json", ".txt") or not p.is_file():
                  continue
              s = p.read_text(errors="replace")
              if len(key) >= 8 and key in s:
                  p.write_text(s.replace(key, "<REDACTED:OPENCODE_API_KEY>"))
          PY

      - name: Upload segment state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-state-${{ matrix.seg }}
          path: ${{ runner.temp }}/soak-state
          retention-days: 7
          if-no-files-found: error

  check:
    needs: [plan, soak]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Last segment's state (cumulative CSV)
        uses: actions/download-artifact@v4
        with:
          name: soak-state-${{ inputs.segments }}
          path: soak-state
      - name: Trend check
        run: |
          set +e
          python3 packages/dsh-plugin/scripts/e2e/soak-check.py soak-state/soak.csv soak-state/summary.md
          rc=$?
          cat soak-state/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report-${{ github.run_id }}
          path: |
            soak-state/soak.csv
            soak-state/summary.md
            soak-state/fail-*.log
          retention-days: 14
          if-no-files-found: warn
